<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unreal Engine 5.8 — Skill Tree</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0a0e14; --bg2:#0d1420; --panel:#111a29; --panel2:#15203233;
    --border:#1e2c42; --text:#cbd5e1; --bright:#f1f5f9; --dim:#64748b;
    --core:#eab308; --world:#22c55e; --logic:#3b82f6; --visual:#ec4899;
    --fx:#f97316; --motion:#a855f7; --prod:#14b8a6;
    --starter:#10b981; --mid:#f59e0b; --adv:#8b5cf6;
  }
  body { font-family:'Segoe UI',Tahoma,sans-serif; background:
    radial-gradient(1200px 600px at 70% -10%, #12233d55, transparent),
    radial-gradient(900px 500px at 10% 110%, #1a103055, transparent), var(--bg);
    color:var(--text); min-height:100vh; overflow-x:hidden; }
  code { font-family:'JetBrains Mono',Consolas,monospace; }

  header.top { padding:26px 34px 8px; display:flex; flex-wrap:wrap; align-items:center; gap:22px; }
  .logo { display:flex; align-items:center; gap:14px; }
  .logo .mark { width:54px; height:54px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#13d9cd,#0f766e); color:#04211c; font-weight:900; font-size:22px;
    box-shadow:0 0 26px #14b8a666; }
  .logo h1 { font-size:22px; color:var(--bright); letter-spacing:.4px; }
  .logo h1 b { color:#2ae5b2; }
  .logo p { font-size:11.5px; color:var(--dim); letter-spacing:2px; text-transform:uppercase; margin-top:2px; }
  .hud { display:flex; gap:12px; margin-left:auto; flex-wrap:wrap; align-items:center; }
  .ring { --p:0; width:64px; height:64px; border-radius:50%; flex:none;
    background: conic-gradient(#2ae5b2 calc(var(--p)*1%), #16233a 0);
    display:flex; align-items:center; justify-content:center; box-shadow:0 0 18px #2ae5b522; }
  .ring .in { width:50px; height:50px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#2ae5b2; font-size:13px; }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px 14px; text-align:center; min-width:92px; }
  .stat b { display:block; font-size:18px; color:var(--bright); }
  .stat span { font-size:10.5px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; }
  .btn { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:9px; padding:9px 16px;
    font-size:12.5px; cursor:pointer; font-family:inherit; font-weight:700; transition:.15s; }
  .btn:hover { border-color:#2ae5b2; color:#2ae5b2; }
  .btn.primary { background:#0f766e; border-color:#14b8a6; color:#eafffa; }
  .btn.primary:hover { background:#115e59; }

  .legend { padding:4px 34px 10px; display:flex; gap:16px; flex-wrap:wrap; }
  .lg { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--dim); }
  .dot { width:10px; height:10px; border-radius:50%; }
  .divider { height:1px; background:linear-gradient(90deg,transparent,var(--border),transparent); margin:0 30px; }

  .stage-wrap { position:relative; overflow:auto; padding:18px 30px 40px; }
  .stage { position:relative; margin:0 auto; }

  .tier-label { position:absolute; left:4px; width:104px; text-align:left; }
  .tier-label .t { font-weight:800; color:var(--bright); font-size:13px; }
  .tier-label .lv { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; padding:2px 8px; border-radius:8px; }
  .lv.s { color:var(--starter); background:#10b9811c; } .lv.m { color:var(--mid); background:#f59e0b1c; } .lv.a { color:var(--adv); background:#8b5cf61c; }

  .lane-head { position:absolute; top:2px; display:flex; flex-direction:column; align-items:center; gap:4px; width:var(--nw); }
  .lane-head .ico { font-size:20px; filter:drop-shadow(0 0 8px currentColor); }
  .lane-head .nm { font-size:11.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase; }

  svg.edges { position:absolute; inset:0; overflow:visible; pointer-events:none; }
  .edge { fill:none; stroke:#1b2942; stroke-width:1.6; opacity:.75; }
  .edge.avail { stroke:#33507a; stroke-width:2.2; opacity:1; }
  .edge.on { stroke-dasharray:7 5; animation:flow 1.2s linear infinite; }
  /* cạnh xuyên ≥2 nhánh: mờ bớt cho đỡ rối; hover node liên quan thì sáng lên */
  .edge.far { opacity:.28; }
  .edge.far.avail { opacity:.55; }
  .edge.hi { stroke:#2ae5b2; stroke-width:2.6; opacity:1; }
  .edge-focus .edge:not(.hi) { opacity:.08; }
  @keyframes flow { to { stroke-dashoffset:-12; } }

  .node { position:absolute; width:var(--nw); border-radius:13px; background:linear-gradient(160deg,var(--panel),#0d1522);
    border:1.5px solid var(--border); padding:10px 11px 9px; cursor:pointer; user-select:none;
    transition:transform .15s, box-shadow .15s, border-color .15s; }
  .node .cost { position:absolute; top:-9px; right:-7px; background:#0b1220; border:1px solid var(--border); color:var(--dim);
    font-size:10px; font-weight:800; padding:1px 7px; border-radius:9px; }
  .node .ic { font-size:17px; margin-bottom:3px; }
  .node .nm { font-size:12.5px; font-weight:800; color:var(--bright); line-height:1.25; }
  .node .en { font-size:10px; color:var(--dim); font-family:'JetBrains Mono',monospace; margin-top:2px; }
  .node.locked { opacity:.38; filter:grayscale(.7); cursor:not-allowed; }
  .node.avail { border-color:color-mix(in srgb, var(--c) 55%, #22334e); box-shadow:0 0 0 1px #00000055, 0 0 16px color-mix(in srgb, var(--c) 22%, transparent); }
  .node.avail:hover { transform:translateY(-3px) scale(1.03); }
  .node.learned { border-color:var(--c); background:linear-gradient(160deg, color-mix(in srgb, var(--c) 16%, var(--panel)), #0d1522);
    box-shadow:0 0 18px color-mix(in srgb, var(--c) 30%, transparent); }
  .node.learned .nm { color:var(--bright); }
  .node.learned::after { content:"✓"; position:absolute; top:-8px; left:-7px; width:18px; height:18px; border-radius:50%;
    background:var(--c); color:#06131a; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; }
  .node.sel { outline:2px solid #fff3; outline-offset:2px; }

  aside.detail { position:fixed; right:18px; top:18px; bottom:18px; width:340px; z-index:50;
    background:linear-gradient(170deg,#101a2b,#0b121e); border:1px solid var(--border); border-radius:16px;
    padding:20px; display:none; flex-direction:column; gap:10px; box-shadow:-18px 0 50px #0009; }
  aside.detail.open { display:flex; }
  aside.detail .x { position:absolute; top:10px; right:12px; background:none; border:none; color:var(--dim); font-size:18px; cursor:pointer; }
  aside.detail .lane-ic { font-size:30px; }
  aside.detail h3 { color:var(--bright); font-size:17px; line-height:1.3; }
  aside.detail .en { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--dim); }
  aside.detail p.d { font-size:13px; line-height:1.65; }
  .terms { background:#0b1220; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:12px; }
  .terms b { color:var(--bright); display:block; margin-bottom:4px; font-size:11px; letter-spacing:1px; text-transform:uppercase; }
  .terms span { display:inline-block; background:#16233a; border:1px solid #24344d; border-radius:6px; padding:1px 7px; margin:2px 3px 2px 0; font-size:11px; }
  .reqs { font-size:12px; }
  .reqs .r { display:inline-block; margin:2px 4px 2px 0; padding:2px 9px; border-radius:8px; border:1px solid var(--border); font-size:11px; }
  .reqs .r.done { color:#2ae5b2; border-color:#14b8a655; }
  .reqs .r.todo { color:var(--dim); }
  .detail .links { display:flex; flex-direction:column; gap:7px; margin-top:2px; }
  .detail a { display:block; text-decoration:none; font-size:12.5px; padding:9px 12px; border-radius:9px;
    border:1px solid var(--border); color:var(--text); background:#0d1522; transition:.15s; }
  .detail a:hover { border-color:#2ae5b2; color:#2ae5b2; }
  .detail .learn-btn { margin-top:auto; }

  footer.foot { padding:14px 34px 26px; color:var(--dim); font-size:12px; }
  footer.foot a { color:#2ae5b2; text-decoration:none; }

  @media (max-width:760px){
    aside.detail { left:10px; right:10px; width:auto; top:auto; bottom:10px; max-height:62vh; }
    .tier-label { display:none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="logo">
    <div class="mark">UE</div>
    <div>
      <h1>Unreal Engine <b>Skill Tree</b></h1>
      <p>Lộ trình học theo dạng cây kỹ năng RPG · 5.8</p>
    </div>
  </div>

    <div class="ring" id="ring"><div class="in" id="ringTxt">0%</div></div>
    <button class="btn" id="btnReset">↺ Reset tiến độ</button>
    <button class="btn" id="btnExpand">Mở rộng hết</button>
  </div>
</header>

<div class="legend" id="legend"></div>
<div class="divider"></div>

<div class="stage-wrap">
  <div class="stage" id="stage"></div>
</div>

<aside class="detail" id="detail">

  <div class="terms" id="dTerms"></div>
  <div class="reqs" id="dReqs"></div>
  <div class="links" id="dLinks"></div>
  <button class="btn primary learn-btn" id="dLearn" onclick="learnSelected()">✦ Học kỹ năng này</button>
</aside>

<footer class="foot">
  Skill tree tổng hợp từ <a href="khoa-hoc-unreal-engine.html">khóa học UE 5.8</a> và <a href="unreal-engine-5.8-docs/site/">bộ docs mirror 3.644 trang</a> — tiến độ lưu trong localStorage của trình duyệt. Thuật ngữ giữ nguyên tiếng Anh theo chuẩn docs Epic.
</footer>

// ================= ENGINE =================
const NW = 168, NH = 82, GX = 46, GY = 136, PAD_X = 120, PAD_Y = 110;
const ROW_H = NH + 26; // chiều cao 1 hàng trong tier band
const laneOf = id => LANES.find(l => l.id === id);
const nodeOf = id => NODES.find(n => n.id === id);
let learned = new Set(JSON.parse(localStorage.getItem("ue-skill-tree") || "[]"));
let selected = null;

// Hàng xếp theo DEPENDENCY (không theo tier SP): layer = 1 + max(layer các node tiền đề),
// nên mọi line tiền đề chỉ đi xuống, không còn line ngược/cùng hàng.
// Tier SP gốc vẫn nằm trong dữ liệu node (n.t) để xuất markdown.
const lyrCache = {};
const lyrOf = id => {
  if (id in lyrCache) return lyrCache[id];
  const reqs = nodeOf(id).req || [];
  return lyrCache[id] = reqs.length ? 1 + Math.max(...reqs.map(lyrOf)) : 0;
};
NODES.forEach(n => { n.lyr = lyrOf(n.id); });

// Mỗi layer là một band cao vừa đủ cho số node tối đa mà một nhánh có trong layer đó:
// nhánh có 2 node cùng layer → xếp 2 hàng dọc trong band, hết đè nhau.
const TIERS = [...new Set(NODES.map(n=>n.lyr))].sort((a,b)=>a-b);
const slotInTier = {}, bandRows = {}, bandTop = {}, laneCnt = {};
TIERS.forEach(t => {
  const groups = {};
  NODES.forEach(n => {
    if (n.lyr !== t) return;
    groups[n.lane] = (groups[n.lane] || 0) + 1;
    slotInTier[n.id] = groups[n.lane] - 1;
  });
  Object.entries(groups).forEach(([lane, c]) => laneCnt[t + "|" + lane] = c);
  bandRows[t] = Math.max(1, ...Object.values(groups));
});
{
  let y = PAD_Y;
  TIERS.forEach(t => { bandTop[t] = y; y += (bandRows[t]-1)*ROW_H + GY; });
}

function pos(n){
  const li = LANES.findIndex(l => l.id === n.lane);
  return { x: PAD_X + li*(NW+GX), y: bandTop[n.lyr] + slotInTier[n.id]*ROW_H };
}

function build(){
  const stage = document.getElementById("stage");
  const maxX = Math.max(...NODES.map(n=>pos(n).x)) + NW + 40;
  const maxY = Math.max(...NODES.map(n=>pos(n).y)) + NH + 60;
  stage.style.width = maxX + "px";
  stage.style.height = maxY + "px";
  stage.style.setProperty("--nw", NW + "px");
  stage.innerHTML = "";

  // legend
  document.getElementById("legend").innerHTML = LANES.map(l =>
    `<span class="lg"><span class="dot" style="background:${l.c};box-shadow:0 0 8px ${l.c}"></span>${l.name}</span>`).join("")
    + `<span class="lg" style="margin-left:auto">Node ✦ = kỹ năng · <b style="color:var(--dim)">✓</b> đã học · viền sáng = khả dụng</span>`;

  // lane headers
  LANES.forEach((l, i) => {
    const el = document.createElement("div");
    el.className = "lane-head";
    el.style.left = (PAD_X + i*(NW+GX)) + "px";
    el.style.color = l.c;
    el.innerHTML = `<span class="ico">${l.ico}</span><span class="nm">${l.name}</span>`;
    stage.appendChild(el);
  });

  // tier labels (hiển thị Tier 1..9 = layer 0..8)
  const tiers = [...new Set(NODES.map(n=>n.lyr))].sort((a,b)=>a-b);
  tiers.forEach(t => {
    const [lv, cls] = TIER_LV(t);
    const el = document.createElement("div");
    el.className = "tier-label";
    el.style.top = (bandTop[t] + 18) + "px";
    el.innerHTML = `<div class="t">Tier ${t+1}</div><span class="lv ${cls}">${lv}</span>`;
    stage.appendChild(el);
  });

  // nodes (tạo TRƯỚC để đo kích thước thẻ thật — thẻ cao 75/86/90px tuỳ tên, khác hằng NH)
  NODES.forEach(n => {
    const p = pos(n);
    const el = document.createElement("div");
    el.className = "node";
    el.id = "node-" + n.id;
    el.style.left = p.x + "px"; el.style.top = p.y + "px";
    el.style.setProperty("--c", laneOf(n.lane).c);
    el.innerHTML = `<span class="cost">${n.cap ? "★" : "SP"}</span><div class="ic">${n.ic}</div>
      <div class="nm">${n.nm}</div><div class="en">${n.en}</div>`;
    el.onclick = () => select(n.id);
    el.onmouseenter = () => focusEdges(n.id, true);
    el.onmouseleave = () => focusEdges(n.id, false);
    stage.appendChild(el);
  });
  const box = id => { const el = document.getElementById("node-" + id);
    return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }; };

  // edges svg — định tuyến trực giao qua các "khe" luôn trống:
  //  • khe ngang: giữa 2 hàng của band 2 hàng (rowGap) hoặc giữa 2 band (interGap)
  //  • khe dọc:   gutter giữa 2 nhánh (cột node không bao giờ vào gutter)
  // mọi đoạn của path nằm gọn trong khe nên không xuyên/cắt bất kỳ node nào.
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "edges");
  svg.setAttribute("width", maxX); svg.setAttribute("height", maxY);
  const colX = li => PAD_X + li * (NW + GX);
  const gutterNear = (dstLi, srcLi) => {
    const gl = colX(dstLi) - GX/2, gr = colX(dstLi) + NW + GX/2;   // gutter trái/phải của cột đích
    return Math.abs(gl - colX(srcLi)) <= Math.abs(gr - colX(srcLi)) ? gl : gr;
  };
  const R = 12;
  const rounded = pts => {
    let s = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const [px, py] = pts[i-1], [cx, cy] = pts[i], [nx, ny] = pts[i+1];
      const l1 = Math.hypot(cx-px, cy-py), l2 = Math.hypot(nx-cx, ny-cy);
      const r = Math.min(R, l1/2, l2/2);
      s += ` L${cx-(cx-px)/l1*r},${cy-(cy-py)/l1*r} Q${cx},${cy} ${cx+(nx-cx)/l2*r},${cy+(ny-cy)/l2*r}`;
    }
    return s + ` L${pts[pts.length-1][0]},${pts[pts.length-1][1]}`;
  };
  const interGap = t => bandTop[t] - 27;           // khe ~54px giữa band t-1 và band t
  const rowKhe   = (t, slot) => bandTop[t] + slot * ROW_H - 13;   // khe 26px ngay TRÊN hàng `slot` (slot>=1)
  let eIdx = 0;
  NODES.forEach(n => (n.req||[]).forEach(r => {
    const p = nodeOf(r), a = pos(p), b = pos(n), ra = box(r), rb = box(n.id);
    const liS = LANES.findIndex(l=>l.id===p.lane), liT = LANES.findIndex(l=>l.id===n.lane);
    const xS = ra.x + ra.w/2, yBot = ra.y + ra.h, xT = rb.x + rb.w/2, yTop = rb.y;
    const jit = ((eIdx % 3) - 1) * 4;
    // khe xuất phát: ngay dưới nguồn (khe hàng dưới nếu còn node cùng nhánh + layer, không thì khe band dưới)
    const hExit  = ((laneCnt[p.lyr + "|" + p.lane] || 1) > slotInTier[p.id] + 1
                    ? rowKhe(p.lyr, slotInTier[p.id] + 1) : interGap(p.lyr + 1)) + jit;
    // khe vào đích: khe ngay trên đích (khe hàng nếu đích không phải hàng đầu, không thì khe band)
    const hEntry = (slotInTier[n.id] >= 1 ? rowKhe(n.lyr, slotInTier[n.id]) : interGap(n.lyr)) - jit;
    const colClear = !NODES.some(m => {
      if (m.lane !== p.lane || m.id === p.id || m.id === n.id) return false;
      const mp = pos(m), mb = box(m.id);
      return Math.abs(mp.x - a.x) < 1 && mb.y < Math.max(yBot, yTop) + 1 && mb.y + mb.h > Math.min(yBot, yTop) - 1;
    });
    let d;
    if (liS === liT && yTop > yBot && colClear) {
      const my = (yBot + yTop)/2;                                    // S-curve dọc như cũ, không có gì chắn giữa
      d = `M${xS},${yBot} C${xS},${my} ${xT},${my} ${xT},${yTop}`;
    } else if (liS !== liT && Math.abs(hExit - hEntry) < 8) {
      const y = (hExit + hEntry) / 2;                                // chữ Z: xuống – ngang khe – xuống
      d = rounded([[xS, yBot], [xS, y], [xT, y], [xT, yTop]]);
    } else {
      const g0 = liS === liT ? a.x + NW + GX/2 : gutterNear(liT, liS);
      const g = g0 + ((eIdx % 3) - 1) * 5;   // lệch nhẹ trong gutter để line dài không chồng nhau
      d = rounded([[xS, yBot], [xS, hExit], [g, hExit], [g, hEntry], [xT, hEntry], [xT, yTop]]);
    }
    eIdx++;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    const laneDist = Math.abs(LANES.findIndex(l=>l.id===p.lane) - LANES.findIndex(l=>l.id===n.lane));
    path.setAttribute("class", "edge" + (laneDist >= 2 ? " far" : ""));
    path.dataset.from = r; path.dataset.to = n.id;
    svg.appendChild(path);
  }));
  // svg phải nằm TRƯỚC node trong DOM để node đè lên line
  stage.insertBefore(svg, stage.querySelector(".node"));
  refresh();
}

function isAvail(n){ return (n.req||[]).every(r => learned.has(r)); }

// Hover node: làm nổi các cạnh liên quan, mờ phần còn lại
function focusEdges(id, on){
  document.querySelector(".stage-wrap").classList.toggle("edge-focus", on);
  document.querySelectorAll(".edge").forEach(e => {
    e.classList.toggle("hi", on && (e.dataset.from === id || e.dataset.to === id));
  });
}

function refresh(){
  let avail = 0;
  NODES.forEach(n => {
    const el = document.getElementById("node-" + n.id);
    el.classList.remove("locked","avail","learned","sel");
    if (learned.has(n.id)) el.classList.add("learned");
    else if (isAvail(n)) { el.classList.add("avail"); avail++; }
    else el.classList.add("locked");
    if (selected === n.id) el.classList.add("sel");
  });
  document.querySelectorAll(".edge").forEach(e => {
    e.classList.remove("on","avail");
    if (learned.has(e.dataset.from)) {
      if (learned.has(e.dataset.to)) e.classList.add("on"), e.style.stroke = laneOf(nodeOf(e.dataset.to).lane).c;
      else { e.classList.add("avail"); e.style.stroke = ""; }
    } else e.style.stroke = "";
  });
  const pct = Math.round(learned.size / NODES.length * 100);
  document.getElementById("statLearned").textContent = learned.size + "/" + NODES.length;
  document.getElementById("statAvail").textContent = avail;
  document.getElementById("ring").style.setProperty("--p", pct);
  document.getElementById("ringTxt").textContent = pct + "%";
  localStorage.setItem("ue-skill-tree", JSON.stringify([...learned]));
}

function select(id){
  selected = id;
  const n = nodeOf(id), l = laneOf(n.lane);
  document.getElementById("dIco").textContent = n.cap ? "🏆" : l.ico;
  document.getElementById("dIco").style.color = l.c;
  document.getElementById("dName").textContent = n.nm;
  document.getElementById("dEn").textContent = n.en;
  document.getElementById("dDesc").textContent = n.d;
  document.getElementById("dTerms").innerHTML = "<b>Thuật ngữ</b>" +
    n.terms.map(t=>`<span>${t}</span>`).join("");
  const reqHtml = (n.req||[]).map(r => {
    const rn = nodeOf(r);
    return `<span class="r ${learned.has(r)?"done":"todo"}">${learned.has(r)?"✓":"🔒"} ${rn.nm}</span>`;
  }).join(" ");
  document.getElementById("dReqs").innerHTML = reqHtml ? "<b style='font-size:11px;letter-spacing:1px;color:var(--dim)'>YÊU CẦU TRƯỚC</b><br>" + reqHtml
    : "<span style='color:var(--dim);font-size:12px'>Không có yêu cầu — có thể học ngay.</span>";
  let links = `<a href="${COURSE}${n.refs.ch}" target="_blank">📖 Chương ${n.refs.ch} trong khóa học</a>`;
  (n.refs.docs||[]).forEach(s => links += `<a href="${DOCS}${s}/" target="_blank">📚 Docs: ${s.replace(/-/g," ")}</a>`);
  document.getElementById("dLinks").innerHTML = links;
  const btn = document.getElementById("dLearn");
  if (learned.has(id)) { btn.textContent = "✓ Đã học — bỏ đánh dấu?"; btn.onclick = () => { learned.delete(id); selected=id; refresh(); select(id); }; }
  else if (isAvail(n)) { btn.textContent = "✦ Học kỹ năng này"; btn.onclick = () => { learned.add(id); refresh(); select(id); }; }
  else { btn.textContent = "🔒 Chưa đủ yêu cầu trước"; btn.onclick = () => {}; btn.disabled = true; }
  if (!learned.has(id) && isAvail(n)) btn.disabled = false;
  document.getElementById("detail").classList.add("open");
  refresh();
}
function learnSelected(){ /* legacy hook */ }
function closeDetail(){ document.getElementById("detail").classList.remove("open"); selected = null; refresh(); }

document.getElementById("btnReset").onclick = () => {
  if (confirm("Reset toàn bộ tiến độ skill tree?")) { learned = new Set(); closeDetail(); refresh(); }
};
document.getElementById("btnExpand").onclick = () => {
  // mở nhánh nhanh: học tất cả node khả dụng theo tầng (demo toàn cây)
  let changed = true;
  while (changed) {
    changed = false;
    NODES.forEach(n => { if (!learned.has(n.id) && isAvail(n)) { learned.add(n.id); changed = true; } });
  }
  refresh();
};
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });
build();
</script>

/* Chạy trên GitHub Pages: docs mirror không được publish (giới hạn 1 GB) —
   chuyển link tới trang docs sang site chính thức của Epic Developer Community.
   Ở local (serve.py) link giữ nguyên, trỏ vào bản mirror. */
(function () {
  if (!/(^|\.)github\.io$/.test(location.hostname)) return;
  var EPIC = "https://dev.epicgames.com/documentation/en-us/unreal-engine";
  var PRE = "unreal-engine-5.8-docs/site/";
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[href^='" + PRE + "']");
    if (!a) return;
    var rest = a.getAttribute("href").slice(PRE).split("#")[0].split("?")[0].replace(/\/+$/, "");
    if (!rest || rest.indexOf("images/") === 0) return;
    e.preventDefault();
    location.href = EPIC + "/" + rest;
  }, true);
})();
